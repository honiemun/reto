services:
  mongo:
    image: mongo:7
    container_name: reto-mongo
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - mongo-data:/data/db
    ports:
      - "127.0.0.1:27017:27017"

  bot:
    build: .
    container_name: reto-bot
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - mongo
    ports:
      - "6370:6370"

volumes:
  mongo-data:

networks:
  default:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/16
